title: PowerShell Encoded Command
id: 0a51bc70-c46b-4463-8a04-311651ba7f75
status: experimental
description: Detects PowerShell started with an encoded (Base64) command, a common way to hide what a script does.
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: Home SOC Lab
date: 2026-11-11
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_flag:
    CommandLine|contains:
      - ' -e '
      - ' -en '
      - ' -enc '
      - ' -encodedcommand '
  condition: all of selection_*
falsepositives:
  - Management and deployment tools that pass encoded scripts
level: medium
